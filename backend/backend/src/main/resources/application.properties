
# ==========================================
# VETCARE - CONFIGURACION GENERAL
# ==========================================

spring.application.name=vetcare

# ==========================================
# CONEXION MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/vetcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=vetcare_user
spring.datasource.password=VetCare_Local_2026!

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

